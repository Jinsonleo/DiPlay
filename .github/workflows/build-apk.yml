name: Build debug APK
on:
  push:
    branches: [CN-Zh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APKs
        run: ./gradlew :mobile:assembleDebug :automotive:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            automotive/build/outputs/apk/debug/*.apk
